<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory 2025</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body class="preview-code-vibes">
  <div id="app" class="theme-code-vibes">
    
    <!-- START SCREEN -->
    <section id="screen-start" class="screen active">
      <article class="content">
        <p>It's play time.</p>
        <h1>Ready to play?</h1>
        <button id="btn-play" class="btn-yellow">
          <strong>Play &rarr;</strong>
        </button>
      </article>
      <img src="./public/assets/images/stadia_controller.svg" alt=" a controller icon">
    </section>

    <!-- SETTINGS SCREEN -->
    <section id="screen-settings" class="screen">
      <div class="settings-wrapper">
        <main class="settings-left">
          <h2>Settings</h2>
          
          <article class="setting-group">
            <h3> Game themes</h3>
            <ul class="setting-options">
              <!-- ONLY 2 THEMES AS REQUESTED -->
              <li><label><input type="radio" name="theme" value="code-vibes" checked> Code vibes theme</label></li>
              <li><label><input type="radio" name="theme" value="gaming"> Gaming theme</label></li>
            </ul>
          </article>

          <article class="setting-group">
            <h3>Choose player</h3>
            <ul class="setting-options">
              <li><label><input type="radio" name="player" value="blue" checked> Blue</label></li>
              <li><label><input type="radio" name="player" value="orange"> Orange</label></li>
            </ul>
          </article>

          <article class="setting-group">
            <h3>Board size</h3>
            <ul class="setting-options">
              <li><label><input type="radio" name="size" value="16" checked> 16 cards (4x4)</label></li>
              <li><label><input type="radio" name="size" value="24"> 24 cards (4x6)</label></li>
              <li><label><input type="radio" name="size" value="64"> 64 cards (8x8)</label></li>
            </ul>
          </article>
        </main>

        <aside class="settings-right">
          <figure class="preview-box">
            <figcaption class="sr-only">Theme Preview</figcaption>
            <div class="preview-cards">
              <div class="preview-card c1"></div>
              <div class="preview-card c2" id="preview-icon">💻</div>
            </div>
          </figure>

          <nav class="settings-summary-bar">
            <p class="summary-text">
              <span id="sum-theme">Code vibes</span> <strong>/</strong> 
              <span id="sum-player">Blue</span> <strong>/</strong> 
              <span id="sum-size">16 cards</span>
            </p>
            <button id="btn-start" class="btn-yellow">Start</button>
          </nav>
        </aside>
      </div>
    </section>

    <!-- GAME SCREEN -->
    <section id="screen-game" class="screen">
      <header class="game-header">
        <div id="score-display" class="score-pill cv"></div>
        <div class="current-turn">
          <p>Current player: <span id="turn-icon" class="turn-indicator"></span></p>
        </div>
        <nav>
          <button id="btn-exit" class="btn-outline">Exit game</button>
        </nav>
      </header>

      <main class="board-container">
        <section id="board"></section>
      </main>

      <!-- Modal overlay -->
      <aside id="quit-modal" class="modal-overlay">
        <article class="modal-content">
          <h3>Are you sure you want<br>to quit the game?</h3>
          <nav class="modal-actions">
            <button id="btn-quit-no" class="btn-pink">No, back to game</button>
            <button id="btn-quit-yes" class="btn-outline-pink">Yes, quit game</button>
          </nav>
        </article>
      </aside>
    </section>

    <!-- GAME OVER SCREEN -->
    <section id="screen-game-over" class="screen">
      <h1 class="game-over-title">Game over</h1>
      <p class="final-score-text">Final score</p>
      <div id="final-score" class="final-score-pill"></div>
    </section>

    <!-- WINNER SCREEN -->
    <section id="screen-winner" class="screen">
      <p class="winner-text">The winner is</p>
      <h1 id="winner-name" class="winner-name"></h1>
      <figure class="winner-icon-box" id="winner-icon">
        <figcaption class="sr-only">Winner Trophy</figcaption>
      </figure>
      <nav>
        <button id="btn-home" class="btn-outline">Back to start</button>
      </nav>
    </section>
  </div>

  <!-- TEMPLATE FOR CARDS (No Inline HTML in JS) -->
  <template id="card-template">
    <article class="card">
      <button class="card__inner">
        <span class="card__face card__face--cover"></span>
        <span class="card__face card__face--content"></span>
      </button>
    </article>
  </template>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
